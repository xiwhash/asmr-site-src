<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#027be3">
<title>我的音声库</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://xiwhash.github.io" crossorigin>
<!-- build: 2026-11-23T19:00:00.000Z -->
{{CSS}}
{{BOOT}}
</head>
<body>

<!-- 启动失败兜底：白屏时把原因显示出来 -->
<div id="bootFail" style="display:none;padding:22px 18px;font-size:14px;line-height:1.7">
  <div style="font-weight:700;font-size:16px;margin-bottom:8px">页面没加载出来</div>
  <div id="bootMsg" style="color:#c62828;font-size:12.5px;word-break:break-all;margin-bottom:14px"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button id="bootReload" style="padding:10px 18px;border-radius:10px;background:#027be3;color:#fff;border:0;font-size:14px;font-weight:600">重新加载</button>
    <button id="bootClear" style="padding:10px 18px;border-radius:10px;background:#e6f2fd;color:#027be3;border:0;font-size:14px;font-weight:600">清缓存后重载</button>
  </div>
  <div style="color:#6b7280;font-size:12px;margin-top:12px">清缓存会同时重置本机的列表数据（服务器上的列表不受影响）。</div>
</div>

<header>
  <h1 id="ttl">我的音声库</h1>
  <button class="hbtn" id="btnLists" title="列表" aria-label="列表"><svg viewBox="0 0 24 24"><path d="M4 6h2v14H4zm4 0h12v2H8zm0 5h12v2H8zm0 5h12v2H8z"/></svg></button>
  <div class="search">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
    <input id="q" placeholder="搜索标题 / 社团 / 标签" autocomplete="off">
  </div>
</header>

<main id="view"></main>

<div id="mini">
  <img id="miniCover" alt="">
  <div class="mi">
    <div class="mt" id="miniT"></div>
    <div class="ms" id="miniS"></div>
  </div>
  <button class="mb" id="miniPlay"><svg id="miniIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
</div>

<div id="full">
  <div class="bar">
    <button id="fClose"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    <div class="bar-actions">
      <button id="fFloat" title="透明桌面字幕" aria-label="透明桌面字幕"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6l-3 3-3-3H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm2 5v2h12V9H6zm0 4v2h8v-2H6z"/></svg></button>
      <button id="fPip" title="系统画中画字幕" aria-label="系统画中画字幕"><svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8zm4-4H1v18h22zm-2 16H3V5h18z"/></svg></button>
    </div>
  </div>
  <div class="art"><img id="fArt" alt=""></div>
  <div class="lyric" id="fLyric"></div>
  <div class="ctrl">
    <div class="prog">
      <span id="fCur">0:00</span>
      <input type="range" id="fSeek" min="0" max="1000" value="0">
      <span id="fDur">0:00</span>
    </div>
  </div>
  <div class="title2">
    <div class="t1" id="fTitle"></div>
    <div class="t2" id="fAlbum"></div>
  </div>
  <div class="btns">
    <button class="sm" id="fPrev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="sm" id="fBack5"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8"/></svg></button>
    <button class="play" id="fPlay"><svg id="fPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="sm" id="fFwd10"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8"/></svg></button>
    <button class="sm" id="fNext"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  </div>
</div>

<div id="addSheet" aria-hidden="true">
  <div class="as-box" id="asBox">
    <button class="as-x" id="asClose" aria-label="关闭">×</button>
    <h3 id="asTitle">加入列表</h3>
    <div class="as-sub" id="asSub"></div>
    <div id="asList"></div>
    <div class="as-row as-new" id="asNew"><span class="as-n">＋ 新建列表</span></div>
    <form class="as-form hide" id="asNewForm">
      <input id="asNewInput" type="text" placeholder="输入新列表名称" autocomplete="off">
      <button type="submit" class="as-ok">确定</button>
      <button type="button" class="as-cancel" id="asNewCancel">取消</button>
    </form>
  </div>
</div>

<div id="batchBar" aria-hidden="true">
  <span class="bb-info" id="bbInfo">已选 0 项</span>
  <button type="button" class="bb-btn bb-pri" id="bbMove">移动到其他列表</button>
  <button type="button" class="bb-btn bb-del" id="bbDel">移出</button>
  <button type="button" class="bb-btn" id="bbCancel">取消</button>
</div>

<div id="newListModal" role="dialog" aria-modal="true" aria-hidden="true">
  <form class="nl-box" id="nlForm">
    <h3>新建列表</h3>
    <input id="nlInput" type="text" placeholder="输入新列表名称" autocomplete="off">
    <div class="nl-btns">
      <button type="button" class="nl-cancel" id="nlCancel">取消</button>
      <button type="submit" class="nl-ok">创建</button>
    </div>
  </form>
</div>

<audio id="au" preload="auto"></audio>

<!-- 透明桌面字幕（纯字幕，无按键） -->
<div id="floatSub" aria-live="polite">
  <div id="floatText"></div>
</div>

<div id="pipGate" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="pg-box">
    <h3 id="pipGateTitle">打开系统画中画</h3>
    <p id="pipGateDesc">画中画窗口内包含上一首、播放/暂停、下一首控制栏；网页桌面歌词为纯透明无按键字幕。</p>
    <button id="pipGateGo" type="button">打开系统画中画</button>
    <button id="pipGateFloat" type="button">改用透明桌面歌词</button>
    <button id="pipGateClose" type="button">取消</button>
  </div>
</div>

<div id="pip-host" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden">
  <canvas id="pipCanvas"></canvas>
  <video id="pipVideo" muted playsinline></video>
</div>

{{DATA}}
{{LISTS}}
{{APP}}
</body>
</html>
