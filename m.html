<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f6f8; --card:#fff; --txt:#1a1c20; --sub:#6b7280; --line:#e3e6ea;
  --pri:#027be3; --pri-soft:#e6f2fd;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--txt:#e8eaed;--sub:#9aa0a6;--line:#2a2e35;--pri:#4da3f0;--pri-soft:#1a2c3f}
}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--txt:#e8eaed;--sub:#9aa0a6;--line:#2a2e35;--pri:#4da3f0;--pri-soft:#1a2c3f}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:50;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
header h1{font-size:17px;font-weight:700;flex:0 0 auto;cursor:pointer}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:0 10px;height:38px}
.search input{flex:1;border:none;background:none;outline:none;color:var(--txt);font-size:14px;min-width:0}
.search svg{width:16px;height:16px;color:var(--sub);flex:0 0 auto}
.navtabs{display:flex;align-items:center;gap:8px;padding:10px 14px 0;flex-wrap:wrap}
.ntab{font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--card);
  color:var(--sub);border:1px solid var(--line);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.ntab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ntab:active{opacity:.8}

/* ---------- 首页网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:14px}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);
  transition:transform .12s;cursor:pointer;position:relative}
.card:active{transform:scale(.97)}
.card .thumb{width:100%;aspect-ratio:1/1;background:var(--pri-soft);object-fit:cover}
.card .meta{padding:8px 9px 10px}
.card .t{font-size:13px;line-height:1.35;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:11px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .rj{font-size:10px;color:var(--pri);background:var(--pri-soft);padding:1px 5px;border-radius:4px;font-weight:600}

/* ---------- 作品页 ---------- */
.work{padding:14px 14px 120px;max-width:900px;margin:0 auto}
.work .head{display:flex;gap:14px;margin-bottom:16px}
.work .head img{width:150px;height:150px;border-radius:10px;object-fit:cover;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.work .head .info{flex:1;min-width:0}
.work h2{font-size:15px;line-height:1.4;font-weight:700}
.work .circle{font-size:12.5px;color:var(--sub);margin-top:6px}
.work .rate{font-size:12.5px;color:#f5a623;margin-top:6px;display:flex;align-items:center;gap:4px}
.work .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.work .tags span{font-size:10.5px;background:var(--pri-soft);color:var(--pri);padding:2px 6px;border-radius:5px}
.tracks{display:flex;flex-direction:column;gap:2px}
.track{display:flex;align-items:center;gap:11px;padding:11px 10px;border-radius:9px;cursor:pointer;background:var(--card)}
.track:active{background:var(--pri-soft)}
.track .idx{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;
  font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600}
.track.playing .idx{background:#e91e63}
.track .name{flex:1;font-size:13.5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track .dur{font-size:11.5px;color:var(--sub);flex:0 0 auto;font-variant-numeric:tabular-nums}

/* ---------- 文件夹行（照 asmr.one 的样子） ---------- */
.fdir{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:9px;cursor:pointer;background:var(--card)}
.fdir:active{background:var(--pri-soft)}
.fdir .ficon{flex:0 0 auto;width:30px;height:24px;position:relative}
.fdir .ficon:before{content:"";position:absolute;left:0;top:0;width:15px;height:7px;border-radius:2px 2px 0 0;background:#f2b705}
.fdir .ficon:after{content:"";position:absolute;left:0;top:5px;width:30px;height:19px;border-radius:2px;background:#ffc107}
.fdir .fmeta{flex:1;min-width:0}
.fdir .fname{font-size:13.5px;line-height:1.35;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdir .fsub{font-size:11.5px;color:var(--sub);margin-top:2px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;font-size:12px;color:var(--sub)}
.crumbs .crumb{cursor:pointer;padding:3px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.crumbs .crumb.on{color:var(--pri);border-color:var(--pri)}
.crumbs .sep{opacity:.5}


/* ---------- 迷你播放条 ---------- */
#mini{position:fixed;left:0;right:0;bottom:0;z-index:60;touch-action:pan-y;background:var(--card);border-top:1px solid var(--line);
  padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);display:none;align-items:center;gap:10px;
  box-shadow:0 -2px 12px rgba(0,0,0,.08)}
#mini.on{display:flex}
#mini img{width:42px;height:42px;border-radius:7px;object-fit:cover;flex:0 0 auto}
#mini .mi{flex:1;min-width:0}
#mini .mt{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .ms{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mb{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#mini svg{width:22px;height:22px;fill:var(--pri)}

/* ---------- 全屏播放器 ---------- */
#full{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 8px)}
#full.on{display:flex}
#full .bar{display:flex;align-items:center;justify-content:space-between;padding:0 14px 6px}
#full .bar-actions{display:flex;align-items:center;gap:4px}
#full .bar button{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
#full .bar svg{width:22px;height:22px;fill:var(--txt)}
#full .bar button.active svg{fill:var(--pri)}
#full .art{flex:0 0 auto;padding:6px 18px 10px;display:flex;justify-content:center}
#full .art img{width:min(72vw,300px);aspect-ratio:1/1;border-radius:14px;object-fit:cover;
  box-shadow:0 6px 24px rgba(0,0,0,.18)}
#full .lyric{flex:1 1 auto;overflow-y:auto;padding:8px 16px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  touch-action:pan-y;overscroll-behavior:contain}
#full .art,#full .title2{touch-action:pan-y;-webkit-user-select:none;user-select:none}
#full .bar,#full .ctrl{touch-action:auto}
#full .lyric::-webkit-scrollbar{display:none}
#full .lrow{display:flex;gap:12px;padding:7px 4px;border-radius:8px;cursor:pointer;transition:background .15s}
#full .lrow .lts{flex:0 0 auto;min-width:44px;font-size:11.5px;line-height:1.75;color:var(--sub);
  font-variant-numeric:tabular-nums;padding-top:2px}
#full .lrow .ltx{flex:1;font-size:14.5px;line-height:1.75;color:var(--sub);word-break:break-word}
#full .lrow.cur{background:var(--pri-soft)}
#full .lrow.cur .ltx{color:var(--txt);font-weight:700;font-size:16px}
#full .lrow.cur .lts{color:var(--pri)}
#full .ctrl{padding:4px 18px 8px}
#full .prog{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--sub);
  font-variant-numeric:tabular-nums}
#full input[type=range]{-webkit-appearance:none;width:100%;height:22px;background:transparent;outline:none;touch-action:auto}
#full input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
#full input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--pri);margin-top:-5px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#full .title2{text-align:center;padding:2px 16px 14px}
#full .title2 .t1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#full .title2 .t2{font-size:11.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#full .btns{display:flex;align-items:center;justify-content:center;gap:22px;padding:2px 0 6px}
#full .btns button{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
#full .btns svg{width:26px;height:26px;fill:var(--txt)}
#full .btns .play{width:64px;height:64px;border-radius:50%;background:var(--pri);box-shadow:0 3px 12px rgba(2,123,227,.35)}
#full .btns .play svg{width:30px;height:30px;fill:#fff}
#full .btns .sm svg{width:22px;height:22px;fill:var(--sub)}

.empty{padding:60px 20px;text-align:center;color:var(--sub);font-size:14px}
.back{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;color:var(--pri);padding:10px 14px;cursor:pointer}
.hide{display:none!important}

/* ---------- 透明桌面字幕（纯字幕，无按键，黑色字体 + 淡灰外圈） ---------- */
#floatSub{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);
  z-index:99998;max-width:min(90vw,780px);width:max-content;padding:8px 18px;
  background:rgba(240,242,246,.38);border:1.5px solid rgba(180,186,196,.55);border-radius:14px;
  box-shadow:0 0 0 2px rgba(210,214,220,.22),0 2px 10px rgba(0,0,0,.08);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#floatSub.on{display:flex}
#floatSub.dragging{cursor:grabbing;opacity:.9;border-color:rgba(160,168,180,.78)}
#floatText{font-size:clamp(18px,3.2vw,24px);line-height:1.45;font-weight:700;letter-spacing:.02em;
  color:#111827;text-align:center;word-break:break-word;white-space:pre-wrap;
  text-shadow:0 1px 2px rgba(255,255,255,.95),0 0 6px rgba(255,255,255,.85)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #floatSub{background:rgba(32,36,44,.42);border-color:rgba(160,170,185,.45);box-shadow:0 0 0 2px rgba(160,170,185,.15),0 2px 10px rgba(0,0,0,.25)}
  :root:not([data-theme="light"]) #floatText{color:#f8fafc;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.85)}
}
:root[data-theme="dark"] #floatSub{background:rgba(32,36,44,.42);border-color:rgba(160,170,185,.45);box-shadow:0 0 0 2px rgba(160,170,185,.15),0 2px 10px rgba(0,0,0,.25)}
:root[data-theme="dark"] #floatText{color:#f8fafc;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.85)}

/* ---------- 系统画中画入口 ---------- */
#pipGate{position:fixed;inset:0;z-index:100000;background:rgba(8,12,18,.55);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:22px;font-family:inherit}
#pipGate.on{display:flex}
#pipGate .pg-box{width:min(420px,100%);background:var(--card,#fff);color:var(--txt,#161a21);border-radius:16px;
  padding:22px 20px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;border:1px solid var(--line,#e3e6ea)}
#pipGate h3{font-size:16.5px;font-weight:700;margin-bottom:8px}
#pipGate p{font-size:13px;line-height:1.65;color:var(--sub,#6b7280);margin-bottom:16px}
#pipGate button{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;
  font-weight:650;margin-top:8px;cursor:pointer;font-family:inherit}
#pipGateGo{background:#027be3;color:#fff;box-shadow:0 3px 12px rgba(2,123,227,.35)}
#pipGateFloat{background:var(--pri-soft,#e6f2fd);color:var(--pri,#027be3)}
#pipGateClose{background:transparent;color:var(--sub,#8a8f98);font-weight:400;font-size:12.5px;padding:8px}

/* ---------- 列表（照 asmr.one playlists） ---------- */
header .hbtn{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
header .hbtn svg{width:18px;height:18px;fill:var(--pri)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:14px}
.lcard{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;position:relative}
.lcard:active{transform:scale(.98)}
.lcard .lt{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--pri-soft);display:block}
.lcard .lm{padding:9px 10px 11px}
.lcard .ln{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .lb{font-size:11.5px;color:var(--sub);margin-top:3px}
.lcard .lc{font-size:11.5px;color:var(--pri);margin-top:2px;font-weight:600}
.lnew{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px dashed var(--line);
  background:transparent!important;box-shadow:none!important;min-height:198px;color:var(--sub);font-size:13px;gap:6px}
.lnew .plus{font-size:30px;line-height:1;color:var(--pri);font-weight:300}
.card-acts{position:absolute;right:6px;top:6px;display:flex;gap:5px;z-index:2}
.card .mv{height:28px;padding:0 9px;border-radius:999px;background:rgba(16,20,26,.74);
  color:#fff;font-size:11.5px;font-weight:600;line-height:1;display:flex;align-items:center;gap:3px;border:none;
  backdrop-filter:blur(4px);transition:background .15s,transform .12s}
.card .rmv,.lcard .rmv{width:28px;height:28px;border-radius:50%;background:rgba(16,20,26,.72);
  color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;border:none;
  backdrop-filter:blur(4px);transition:background .15s,transform .12s}
.card .mv:active,.card .rmv:active{transform:scale(.92)}
.card .mv svg{width:13px;height:13px;fill:currentColor;pointer-events:none}
.lcard .rmv{position:absolute;right:6px;top:6px}
.card.sel{outline:2.5px solid var(--pri);outline-offset:-2px}
.card .chk{position:absolute;left:7px;top:7px;width:24px;height:24px;border-radius:50%;
  background:rgba(16,20,26,.55);border:2px solid #fff;color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.card.sel .chk{background:var(--pri);border-color:var(--pri)}
.lhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.lhead-acts{display:flex;gap:8px;align-items:center}
.lbtn{font-size:12.5px;color:var(--pri);background:var(--pri-soft);padding:6px 12px;border-radius:999px;font-weight:600}
.lbtn.on{background:var(--pri);color:#fff}
.wbtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.wbtn{font-size:12.5px;color:var(--pri);background:var(--pri-soft);padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:600}
.wbtn:active{opacity:.7}
.wlists{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--sub)}
.wlist-tag{font-size:11.5px;color:var(--pri);background:var(--card);border:1px solid var(--line);padding:3px 9px;border-radius:999px;cursor:pointer}
.wlist-tag:active{background:var(--pri-soft)}
#addSheet{position:fixed;inset:0;z-index:100003;display:none;background:rgba(8,12,18,.45)}
#addSheet.on{display:block}
#addSheet .as-box{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:74vh;overflow:auto}
#addSheet h3{font-size:15px;margin-bottom:4px;padding-right:40px}
#addSheet .as-sub{font-size:12px;color:var(--sub);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#addSheet .as-sub:empty{display:none}
#addSheet .as-row{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);
  font-size:14px;cursor:pointer}
#addSheet .as-row.disabled{opacity:.5;cursor:default}
#addSheet .as-row:last-child{border-bottom:none}
#addSheet .as-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#addSheet .as-c{font-size:12px;color:var(--sub);flex:0 0 auto}
#addSheet .as-tick{color:var(--pri);font-weight:700;font-size:16px;width:20px;text-align:center;flex:0 0 auto}
#addSheet .as-cur{font-size:11px;color:var(--pri);background:var(--pri-soft);padding:2px 7px;border-radius:999px;flex:0 0 auto;font-weight:600}
#addSheet .as-mv{font-size:12px;color:var(--pri);background:var(--pri-soft);padding:4px 10px;border-radius:999px;flex:0 0 auto;font-weight:600}
#addSheet .as-mv:active{opacity:.7}
#addSheet .as-new{color:var(--pri);font-weight:600;border-bottom:none}
#addSheet .as-x{position:absolute;right:12px;top:10px;color:var(--sub);font-size:22px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center}
#addSheet .as-form{display:flex;align-items:center;gap:8px;padding:10px 0 2px}
#addSheet .as-form input{flex:1;min-width:0;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--txt);font-size:14px;outline:none}
#addSheet .as-form input:focus{border-color:var(--pri)}
#addSheet .as-ok{height:38px;padding:0 14px;border-radius:10px;background:var(--pri);color:#fff;font-size:13.5px;font-weight:600}
#addSheet .as-cancel{height:38px;padding:0 10px;border-radius:10px;color:var(--sub);font-size:13.5px}

#batchBar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:100001;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;
  box-shadow:0 8px 28px rgba(0,0,0,.2);display:none;align-items:center;gap:8px}
#batchBar.on{display:flex}
#batchBar .bb-info{flex:1;font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap}
#batchBar .bb-btn{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;background:var(--bg);color:var(--txt)}
#batchBar .bb-pri{background:var(--pri);color:#fff}
#batchBar .bb-del{background:rgba(220,38,38,.12);color:#dc2626}

.ltools{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:6px 10px 0}
.ltools .back{padding:6px 8px;font-size:12.5px}
.lcard-acts{position:absolute;right:6px;top:6px;display:flex;gap:5px;z-index:2}
.lcard .ledit,.lcard .ldel{width:28px;height:28px;border-radius:50%;background:rgba(16,20,26,.68);
  color:#fff;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;border:none;
  backdrop-filter:blur(4px)}
.lcard .ledit svg{width:14px;height:14px;fill:currentColor;pointer-events:none}
.lbtn.danger{background:rgba(220,38,38,.12);color:#dc2626}
#newListModal,#delListModal{position:fixed;inset:0;z-index:100004;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(8,12,18,.5);backdrop-filter:blur(4px)}

<script>
(function(){
  try{
    var th = localStorage.getItem('asmr_theme_v1');
    if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  }catch(e){}
  window.__bootOK = false;
  function show(msg){
    var f = document.getElementById('bootFail'); if (!f) return;
    if (window.__bootOK) return;
    var ld = document.getElementById('bootLoading');
    if (ld) ld.style.display = 'none';
    f.style.display = 'block';
    var m = document.getElementById('bootMsg');
    if (m) m.textContent = String(msg || '').slice(0, 300);
  }
  window.__bootShow = show;
  window.addEventListener('error', function(e){
    try{ show((e.message || '脚本错误') + '  ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '')); }catch(x){}
  }, true);
  window.addEventListener('DOMContentLoaded', function(){
    var r = document.getElementById('bootReload');
    if (r) r.onclick = function(){ location.reload(); };
    var c = document.getElementById('bootClear');
    if (c) c.onclick = function(){
      try{ localStorage.removeItem('asmr_lists_v1'); localStorage.removeItem('asmr_lists_v2'); }catch(e){}
      try{ if (window.caches) caches.keys().then(function(k){ k.forEach(function(x){ caches.delete(x); }); }); }catch(e){}
      location.href = location.pathname + '?r=' + Date.now();
    };
    /* 6 秒还没渲染成功 = 卡住了，给出重试/清缓存提示 */
    setTimeout(function(){
      if (!window.__bootOK) show('数据加载超时（可能是网络较慢或缓存异常，请点击重新加载）');
    }, 6000);
  });
})();
</script>

function __fmtLen(s){ if(!s) return ''; var h=s/3600; return h>=1 ? (h.toFixed(1)+'h') : (Math.round(s/60)+'min'); }
function __nodeAt(ft, p){
  if(!p || !ft) return null;
  var node = null, list = ft, parts = String(p).split('/').map(Number);
  for(var i=0;i<parts.length;i++){ node = list[parts[i]]; if(!node) return null; list = node.c||[]; }
  return node;
}
function __autoPath(w){
  var ft = w.ft;
  if(!ft || !ft.length) return null;
  var NONE = /se\s*(?:なし|無し|無)|no\s*se|効果音なし|効果音無し|射精音なし|射精音無し|サンプル|過去作|紹介|特典|イラスト|台本|画像|フリートーク|次回予告/i;
  var ARI  = /se\s*(?:あり|有り|有|on)|本編|本文|本篇/i;

  function direct(p){
    var c = 0;
    for(var i=0;i<w.tracks.length;i++){ if((w.tracks[i].p||'') === p) c++; }
    return c;
  }
  function score(n){
    var s = n.s || 0;
    if(ARI.test(n.t)) s = s * 1.4;
    if(/mp3|mp３|音声|音データ|voice|wav/i.test(n.t)) s = s * 1.05;
    return s;
  }
  function descend(node){
    var guard = 0;
    while(node && node.c && node.c.length && direct(node.p) === 0 && guard++ < 8){
      var pick = null;
      for(var i=0;i<node.c.length;i++){
        var ch = node.c[i];
        if((ch.n||0) <= 0 || NONE.test(ch.t)) continue;
        if(!pick || score(ch) > score(pick)) pick = ch;
      }
      if(!pick) break;
      node = pick;
    }
    return node;
  }

  var best = null;
  (function walk(list){
    for(var i=0;i<list.length;i++){
      var n = list[i];
      if((n.n||0) > 0 && !NONE.test(n.t)){
        if(!best || score(n) > score(best)) best = n;
      }
      if(n.c && n.c.length) walk(n.c);
    }
  })(ft);

  if(!best) return null;
  if((best.s||0) < (w.rs||0) || !(best.s||0)) return null;   /* 根目录才是主体 */
  var node = descend(best);
  return node ? node.p : best.p;
}
function renderWork(rj, skipHist, path){

  __curView = { type:'work', lid:__fromListId, rj:rj };
  ttl.textContent = rj;
  if (!skipHist && window.__hist) window.__hist.push('work', rj);

  var backBtn = (__fromListId && __lById(__fromListId))
    ? '<div class="back" id="backToList" data-lid="'+esc(__fromListId)+'">← 返回「'+esc(__lById(__fromListId).name)+'」</div>'
    : '<div class="back" id="backHome">← 返回</div>';
  var h = '<div class="work">';
  h += backBtn;
  h += '<div class="head">'
    + (w.cover?'<img src="'+esc(w.cover)+'" alt="">':'')
    + '<div class="info"><h2>'+esc(w.title)+'</h2>'
    + (w.circle?'<div class="circle">'+esc(w.circle)+'</div>':'')
    + (w.rate?'<div class="rate">★ '+w.rate+(w.rateN?' ('+w.rateN+')':'')+'</div>':'')
    + (w.vas&&w.vas.length?'<div class="circle">CV: '+w.vas.map(esc).join(' / ')+'</div>':'')
    + (w.tags&&w.tags.length?'<div class="tags">'+w.tags.slice(0,8).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>':'')
    + '</div></div>'
    + '<div class="wbtns">'
    + '<span class="wbtn" id="addToList" data-rj="'+esc(w.rj)+'">＋ 加入列表</span>'
    + '<span class="wbtn" id="moveToList" data-rj="'+esc(w.rj)+'">⇄ 移动到其他列表</span>'
    + '<span class="wlists" id="workLists">'+__workListsHtml(w.rj)+'</span>'

  var ft = w.ft;
  if(!ft || !ft.length){
    h += '<div class="tracks">';
    for(var i=0;i<w.tracks.length;i++){
      var t = w.tracks[i];
      h += '<div class="track" data-rj="'+esc(w.rj)+'" data-i="'+i+'">'
        + '<div class="idx">'+(i+1)+'</div>'

    view.innerHTML = h;

  }

  var key = (path === undefined || path === null) ? __autoPath(w) : path;
  if(key === null || key === undefined) key = '';
  var node = __nodeAt(ft, key);

  var kids = (node ? (node.c||[]) : ft);
  h += '<div class="tracks">';

  }
  var __n = 0;
  for(var j=0;j<w.tracks.length;j++){

    __n++;
    h += '<div class="track" data-rj="'+esc(w.rj)+'" data-i="'+j+'">'
      + '<div class="idx">'+__n+'</div>'
      + '<div class="name">'+esc(tr.n)+'</div>'
      + '</div>';
  }
  h += '</div></div>';
  view.innerHTML = h;
  try{
    __pfPrime(w, (function(){
      for(var __q=0;__q<w.tracks.length;__q++){ if((w.tracks[__q].p||'')===key) return __q; }
      return 0;
    })());
  }catch(e){}
}

/* ---------- 字幕按需加载（subs/<RJ>.json） ---------- */
var __subCache = {}, __subPending = {};
var __subv = D.subv || null;
function __subsReady(rj){
  if(!__subv) return true;                       /* 旧版内联数据：字幕已在页面里 */
  if(!__subv[rj]) return true;                   /* 这部作品本来就没有字幕 */
  return !!__subCache[rj];
}
function __subsFor(rj, i){
  var k3 = String(i).padStart(3,'0');
  if(subs && subs[rj+'/'+k3]) return subs[rj+'/'+k3];
  var c = __subCache[rj];
  return c ? (c[k3] || null) : null;
}
function __loadSubs(rj){
  if(__subsReady(rj)) return Promise.resolve(__subCache[rj] || null);
  if(__subPending[rj]) return __subPending[rj];
  var url = 'subs/' + encodeURIComponent(rj) + '.json?v=' + __subv[rj];
  var p = (function attempt(n){
    return fetch(url, { cache:'force-cache' }).then(function(r){
      if(!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).catch(function(err){
      if(n < 2) return new Promise(function(res){ setTimeout(res, 800 * (n + 1)); }).then(function(){ return attempt(n + 1); });
      throw err;
    });
  })(0).then(function(j){
    __subCache[rj] = j || {};
    delete __subPending[rj];
    return __subCache[rj];
  }).catch(function(){
    delete __subPending[rj];
    return null;
  });
  __subPending[rj] = p;
  return p;
}

var curLine = -1;
function centerLine(el, smooth){
  var box = document.getElementById('fLyric');
  if(!el || !box) return;
  var er = el.getBoundingClientRect(), br = box.getBoundingClientRect();
  var delta = (er.top - br.top) - (box.clientHeight - er.height) / 2;
  var maxTop = Math.max(0, box.scrollHeight - box.clientHeight);
  var top = Math.max(0, Math.min(box.scrollTop + delta, maxTop));
  if(Math.abs(top - box.scrollTop) < 0.5) return;
  if(smooth && box.scrollTo) box.scrollTo({ top: top, behavior: 'smooth' });
  else box.scrollTop = top;
}

function recoverAudio(attempt) {
  try {
    if (!au.src) return;
    var p;
    try { p = au.play(); } catch (e) { p = null; }

    if (!p || !p.then) {
      console.log('[pip] play() 未返回 Promise');
      return;
    }

    p.then(function () {
      console.log('[pip] recoverAudio ok (attempt ' + attempt + ')');
      syncPipBarIcon();
    }).catch(function (e) {
      console.warn('[pip] play failed: ' + (e && e.name) + ' ' + (e && e.message));
      if (attempt < 3) {
        setTimeout(function () { recoverAudio(attempt + 1); }, 300 * (attempt + 1));
        return;
      }
      /* 三次都失败：提示用户 */
      try {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:120px;' +
          'z-index:99999;background:#c62828;color:#fff;padding:10px 16px;border-radius:10px;' +
          'font-size:13px;max-width:88vw;text-align:center;box-shadow:0 3px 14px rgba(0,0,0,.3)';
        d.textContent = '播放失败（' + (e && e.name ? e.name : 'unknown') + '），请点页面上的播放按钮';
        document.body.appendChild(d);
        setTimeout(function () { d.remove(); }, 6000);
      } catch (x) {}
      syncPipBarIcon();
    });
  } catch (e) {
    console.warn('[pip] recoverAudio err: ' + e.message);
  }
}

/* PiP 对象声明 */
var PiP = {
  canvas:null, video:null, ctx:null,
  pipWindow:null, currentPiPStatus:false,
  started:false, currentText:'',
  _suppress:false, _suppressTimer:null, _hb:null,

  get supported(){
    try{
      if ('pictureInPictureEnabled' in document && document.pictureInPictureEnabled) return true;
      if (this.video && 'webkitSupportsPresentationMode' in this.video &&
          this.video.webkitSupportsPresentationMode('picture-in-picture')) return true;
      if (window.documentPictureInPicture) return true;
    }catch(e){}
    return false;
  },

  suppress(ms){
    this._suppress = true;
    if (this._suppressTimer) clearTimeout(this._suppressTimer);
    this._suppressTimer = setTimeout(function(){ PiP._suppress = false; }, ms || 600);
  },

  startHeartbeat(){
    this.stopHeartbeat();
    /* 30fps 流自动推帧；这里只负责重绘字幕内容 */
    this._hb = setInterval(function(){
      try{
        var txt = PiP.currentLyricText();
        if (txt !== PiP.currentText) PiP.paint(txt);
        PiP.requestFrame();   /* 兼容：有 requestFrame 就调 */
        syncPipBarIcon();
      }catch(e){}
    }, 300);
  },
  stopHeartbeat(){ if (this._hb){ clearInterval(this._hb); this._hb = null; } },

  requestFrame(){
    try{
      if (!this.video || !this.video.srcObject) return;
      var t = this.video.srcObject.getVideoTracks()[0];
      if (t && t.requestFrame) t.requestFrame();
    }catch(e){}
  },

  init(){
    this.canvas = document.getElementById('pipCanvas');
    this.video = document.getElementById('pipVideo');
    if (!this.canvas || !this.video) return;
    this.ctx = this.canvas.getContext('2d');

    /* --- video 状态 → 驱动 audio（照 asmr-player） --- */
    this.video.addEventListener('pause', function(){
      if (PiP._suppress) return;
      try{ if (!au.paused) au.pause(); }catch(e){}
      try{ syncPipBarIcon(); }catch(e){}
    }, true);

    this.video.addEventListener('play', function(){
      if (PiP._suppress) return;
      /* 0fps/30fps 流：不推帧 play() 可能挂起 */
      try{ PiP.requestFrame(); }catch(e){}
      setTimeout(function(){ try{ PiP.requestFrame(); }catch(e){} }, 80);
      if (au.paused) { recoverAudio(0); }
      try{ syncPipBarIcon(); }catch(e){}
    }, true);

    this.video.addEventListener('playing', function(){
      if (PiP._suppress) return;
      try{ PiP.requestFrame(); }catch(e){}
      if (au.paused) { recoverAudio(0); }
      try{ syncPipBarIcon(); }catch(e){}
    }, true);

    /* 长暂停后 canvas 流可能被判结束 → 重建，否则再点播放毫无反应 */
    this.video.addEventListener('ended', function(){
      if (PiP._suppress) return;
      try{ PiP.rebuildStream(); }catch(e){}
    }, true);

    /* 对账（手机系统画中画专用）：安卓 PiP 的播放/暂停有时根本不派发事件，
       页面此时是隐藏状态，每 500ms 直接比对 video 与 audio 的真实状态并纠正。
       这是"暂停后再点播放没反应"的关键修复。 */
    setInterval(function(){
      try{
        if (!PiP.currentPiPStatus || PiP.docWin || PiP._suppress) return;
        if (!document.hidden) return;
        if (!PiP.video) return;
        var _tr = PiP.video.srcObject && PiP.video.srcObject.getVideoTracks ? PiP.video.srcObject.getVideoTracks()[0] : null;
        if (PiP.video.ended || !_tr || _tr.readyState === 'ended'){
          var _now = Date.now();
          if (!PiP._lastRebuild || _now - PiP._lastRebuild > 2000){ PiP._lastRebuild = _now; PiP.rebuildStream(); }
          return;
        }
        var vPlaying = !PiP.video.paused;
        var aPlaying = !au.paused;
        if (vPlaying === aPlaying) return;
        log('reconcile video=' + (vPlaying ? 'playing' : 'paused') + ' audio=' + (aPlaying ? 'playing' : 'paused'));
        if (vPlaying){ PiP.requestFrame(); recoverAudio(0); }
        else { try{ au.pause(); }catch(e){} }
        try{ syncPipBarIcon(); }catch(e){}
      }catch(e){}
    }, 500);

    this.video.addEventListener('enterpictureinpicture', function(ev){
      PiP.currentPiPStatus = true;
      PiP.pipWindow = ev.pictureInPictureWindow;
      if (PiP.pipWindow){
        PiP.pipWindow.addEventListener('resize', function(){ PiP.onWindowResize(); });
      }
      PiP.onWindowResize();
      PiP.startHeartbeat();
      PiP.flush();
      syncSubButtons();
      log('enter pip');
    });

    this.video.addEventListener('leavepictureinpicture', function(){
      PiP.currentPiPStatus = false;
      PiP.stopHeartbeat();
      PiP.pipWindow = null;
      PiP.resetSize();
      syncSubButtons();
      log('leave pip');
    });

    // 初始化画布
    this.resetSize();
    this.paint('');
    /* 30fps：0fps 静态流 Chrome 不给 PiP 控件（播放/暂停按钮），必须用真实帧率 */
    var s = this.canvas.captureStream(30);
    this.video.srcObject = s;
    try{ var q = this.video.play(); if (q && q.catch) q.catch(function(){}); }catch(e){}
    this.started = true;
  },

  resetSize(){
    if (!this.canvas) return;
    var w = 2 * (window.innerWidth || 480);
    this.canvas.width = Math.round(w);
    this.canvas.height = Math.round(w / 20 * 3);
  },

  /* 长暂停后 canvas 流可能被判结束，重建一次 */
  rebuildStream(){
    try{
      log('rebuildStream');
      this.video.srcObject = null;
      var w = 2 * (window.innerWidth || 480);
      this.canvas.width = Math.round(w);
      this.canvas.height = Math.round(w / 20 * 3);
      this.video.srcObject = this.canvas.captureStream(30);
      this.paint(this.currentLyricText());
      this.requestFrame();
      if (this.currentPiPStatus && !au.paused) {
        this.suppress(400);
        var p = this.video.play();
        if (p && p.catch) p.catch(function(){});
      }
    }catch(e){ log('rebuildStream err ' + e.message); }
  },

  onWindowResize(){
    if (!this.pipWindow || !this.canvas) return;
    var w = this.pipWindow.width, h = this.pipWindow.height;
    if (!w || !h) return;
    if (Math.abs(this.canvas.width - 2*w) < 8 && Math.abs(this.canvas.height - 2*h) < 8) return;
    this.canvas.width = Math.round(2 * w);
    this.canvas.height = Math.round(2 * h);
    this.paint(this.currentText);
    this.requestFrame();
  },

  paint(text){
    this.currentText = text || '';
    if (this.docTextEl){
      try{ this.docTextEl.textContent = this.currentText; }catch(e){}
    }
    if (!this.ctx || !this.canvas) return;
    var W = this.canvas.width, H = this.canvas.height;
    var s = Math.max(18, Math.round(W / 22));
    var ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    var t = String(text || '').trim();
    if (!t) return;
    ctx.font = '700 ' + s + 'px "-apple-system", "BlinkMacSystemFont", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#111827';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    var maxW = W * 0.9;
    var lines = [];
    if (ctx.measureText(t).width <= maxW){
      lines.push(t);
    } else {
      var line = '';
      for (var i = 0; i < t.length; i++){
        var next = line + t[i];
        if (ctx.measureText(next).width > maxW && line){
          lines.push(line);
          line = t[i];
          if (lines.length === 1){
            var rest = t.slice(i);
            while (rest.length > 1 && ctx.measureText(rest).width > maxW){
              rest = rest.slice(0, -1);
            }
            lines.push(rest);
            line = '';
            break;
          }
        } else {
          line = next;
        }
      }
      if (line) lines.push(line);
    }
    var lh = s * 1.35;
    var startY = H / 2 - ((lines.length - 1) * lh) / 2;
    for (var k = 0; k < lines.length; k++){
      ctx.fillText(lines[k], W / 2, startY + k * lh);
    }
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  },

  flush(){ this.paint(this.currentLyricText()); this.requestFrame(); },

  currentLyricText(){
    var t = au.currentTime, idx = -1;
    for (var i=0;i<cur.subs.length;i++){ if (cur.subs[i].t <= t) idx = i; else break; }

var FPK = 'asmr_float_pos_v1';
var FloatSub = {
  on: false,
  el: null, textEl: null,
  init(){
    this.el = document.getElementById('floatSub');
    this.textEl = document.getElementById('floatText');
    if (!this.el) return;
    this.makeDraggable();
    this.applySavedPos();
  },
  savePos(){
    var el = this.el;
    if (!el || !window.innerWidth || !window.innerHeight) return;
    try{
      var r = el.getBoundingClientRect();
      var cx = (r.left + r.width / 2) / window.innerWidth;
      var ty = r.top / window.innerHeight;
      localStorage.setItem(FPK, JSON.stringify({ cx: Math.max(0.05, Math.min(0.95, cx)), ty: Math.max(0.02, Math.min(0.94, ty)) }));
    }catch(e){}
  },
  applySavedPos(){
    var el = this.el;
    if (!el) return;
    var p = null;
    try{ p = JSON.parse(localStorage.getItem(FPK) || 'null'); }catch(e){ p = null; }
    if (!p || typeof p.cx !== 'number' || typeof p.ty !== 'number') return;
    var vw = window.innerWidth || 360, vh = window.innerHeight || 640;
    var w = el.offsetWidth || 220, h = el.offsetHeight || 42;
    var nx = Math.min(Math.max(4, Math.round(p.cx * vw - w / 2)), Math.max(4, vw - w - 4));
    var ny = Math.min(Math.max(4, Math.round(p.ty * vh)), Math.max(4, vh - h - 4));
    el.style.transform = 'none';
    el.style.left = nx + 'px';
    el.style.top = ny + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
  },
  makeDraggable(){
    var self = this, el = this.el;
    if (!el || el.dataset.dragReady) return;
    el.dataset.dragReady = '1';
    var sx = 0, sy = 0, ox = 0, oy = 0, dragging = false, moved = false;
    function down(e){
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var r = el.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
      dragging = true; moved = false;
      el.classList.add('dragging');
      el.style.transform = 'none';
      el.style.left = ox + 'px';
      el.style.top = oy + 'px';
      el.style.right = 'auto';
      el.style.bottom = 'auto';
      try{ el.setPointerCapture(e.pointerId); }catch(x){}
      e.preventDefault();
    }
    function move(e){
      if (!dragging) return;
      if (Math.abs(e.clientX - sx) > 2 || Math.abs(e.clientY - sy) > 2) moved = true;
      var w = el.offsetWidth, h = el.offsetHeight;
      var nx = Math.min(Math.max(0, ox + e.clientX - sx), Math.max(0, window.innerWidth - w));
      var ny = Math.min(Math.max(0, oy + e.clientY - sy), Math.max(0, window.innerHeight - h));
      el.style.left = nx + 'px';
      el.style.top = ny + 'px';
    }
    function up(e){
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      try{ el.releasePointerCapture(e.pointerId); }catch(x){}
      if (moved) self.savePos();
    }
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    window.addEventListener('resize', function(){
      if (!self.on) return;
      if (el.style.left && el.style.transform === 'none'){
        self.applySavedPos();
      }
    });
  },
  show(){
    if (!this.el) this.init();
    if (!this.el) return;
    this.on = true;
    this.el.classList.add('on');
    this.set(textOfNow());
    var self = this;
    setTimeout(function(){ self.applySavedPos(); }, 0);
    syncSubButtons();
  },
  hide(){
    this.on = false;
    if (this.el) this.el.classList.remove('on');
    syncSubButtons();
  },
  set(t){ if (this.textEl) this.textEl.textContent = t || ''; }
};

(function(){
  var hudEl = null, sw = null;
  function hud(){
    if(hudEl) return hudEl;
    hudEl = document.createElement('div');
    hudEl.style.cssText = 'position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:100002;' +
      'background:rgba(16,20,26,.88);color:#fff;padding:11px 20px;border-radius:14px;font-size:16px;' +
      'font-weight:700;letter-spacing:.4px;display:none;pointer-events:none;font-variant-numeric:tabular-nums;' +
      'box-shadow:0 10px 34px rgba(0,0,0,.42);white-space:nowrap';
    document.body.appendChild(hudEl);
    return hudEl;
  }
  function hideHud(){ if(hudEl) hudEl.style.display = 'none'; }
  function showHud(t){ var el = hud(); el.textContent = t; el.style.display = 'block'; }

  function attach(el){
    if(!el) return;
    el.addEventListener('pointerdown', function(e){
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      var t = e.target;
      if(t && t.closest && t.closest('button,input,select,textarea,#fSeek')) return;
      if(!cur.w || !isFinite(au.duration) || au.duration <= 0) return;
      sw = { id:e.pointerId, x0:e.clientX, y0:e.clientY, dx:0, dy:0,
             base:au.currentTime, dur:au.duration, mode:null, target:null };
    }, { passive:true });

    el.addEventListener('pointermove', function(e){
      if(!sw || e.pointerId !== sw.id) return;
      sw.dx = e.clientX - sw.x0;
      sw.dy = e.clientY - sw.y0;
      if(!sw.mode){
        if(Math.abs(sw.dx) > 12 && Math.abs(sw.dx) > Math.abs(sw.dy) * 1.3) sw.mode = 'seek';
        else if(Math.abs(sw.dy) > 12 && Math.abs(sw.dy) > Math.abs(sw.dx) * 1.3){ sw = null; return; }  /* 竖划=滚字幕 */
        else return;
      }
      if(sw.mode !== 'seek') return;
      try{ e.preventDefault(); }catch(x){}
      var per = Math.max(0.25, Math.min(2.0, sw.dur / 700));   /* 划满一屏≈曲长的 1/1.75 */
      var nt = sw.base + sw.dx * per;
      if(nt < 0) nt = 0;
      if(nt > sw.dur - 0.05) nt = sw.dur - 0.05;
      sw.target = nt;
      showHud((sw.dx >= 0 ? '▶▶ ' : '◀◀ ') + fmt(nt) + '  /  ' + fmt(sw.dur));
    }, { passive:false });

    function end(e){
      if(!sw || (e && e.pointerId !== undefined && e.pointerId !== sw.id)) return;
      var s = sw; sw = null;
      hideHud();
      if(s.mode === 'seek' && s.target !== null && Math.abs(s.dx) > 12){
        __swBlock = Date.now();
        __lyricLock = Date.now() + 900;
        try{ au.currentTime = s.target; }catch(e2){}
        curLine = -1;
        syncLyric(true);
      }
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('pointerleave', function(e){ if(sw && e.pointerType === 'mouse') end(e); });
  }
  attach(full);
  attach(mini);
})();

/* ==================== 列表与移动引擎（v2：零丢失快照架构） ==================== */
var LK = 'asmr_lists_v2';
var LK_LEGACY = 'asmr_lists_v1';
var __lState = { version: 2, serverSig: '', serverSnap: {}, lists: [] };
var LISTS = __lState.lists;

function __lUniq(arr){
  if(!Array.isArray(arr)) return [];
  var out = [], seen = {};
  arr.forEach(function(x){
    var s = String(x || '').trim();
    if(s && !seen[s]){ seen[s] = 1; out.push(s); }
  });
  return out;
}
function __lValidWork(rj){
  var key = String(rj || '').trim();
  if(!key) return false;
  for(var i = 0; i < works.length; i++){ if(works[i].rj === key) return true; }
  return false;
}
function __lFind(rj){
  var key = String(rj || '').trim();
  if(!key) return null;
  for(var i = 0; i < works.length; i++){ if(works[i].rj === key) return works[i]; }
  return null;
}
function __lMakeList(x){
  return {
    id: String(x && x.id || ''),
    name: String(x && x.name || '未命名列表'),
    by: String(x && x.by || '谢hhhh'),
    works: __lUniq(x && x.works).filter(__lValidWork)
  };
}
function __lBuildServerSnap(rawBase){
  var lists = (rawBase || []).map(__lMakeList).filter(function(l){ return !!l.id; });
  var snap = {};
  lists.forEach(function(l){ snap[l.id] = l.works.slice(); });
  var sig = JSON.stringify(lists.map(function(l){ return [l.id, l.name, l.works]; }));
  return { lists: lists, snap: snap, sig: sig };
}
function __lSave(){
  var ok = false;
  try{
    __lState.version = 2;
    __lState.lists = LISTS;
    var raw = JSON.stringify(__lState);
    localStorage.setItem(LK, raw);
    ok = (localStorage.getItem(LK) === raw);
  }catch(e){ ok = false; }
  return ok;
}
function __lLoad(){
  var srv = __lBuildServerSnap(window.__LISTS__ || []);
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LK) || 'null'); }catch(e){ saved = null; }

  /* 首次使用 v2（或旧版升级）：以服务器列表为准初始化，避免旧 v1 脏缓存隐藏作品；
     仅迁移旧 v1 中的用户自建列表（id 与名称均不与服务器冲突的列表）。 */
  if(!saved || saved.version !== 2 || !Array.isArray(saved.lists) || !saved.lists.length){
    var initLists = srv.lists.map(__lMakeList);
    try{
      var oldV1 = JSON.parse(localStorage.getItem(LK_LEGACY) || 'null');
      if(Array.isArray(oldV1)){
        var srvIds = {}, srvNames = {};
        initLists.forEach(function(l){
          srvIds[l.id] = 1;
          srvNames[String(l.name).trim().toLowerCase()] = 1;
        });
        oldV1.forEach(function(ol){
          if(!ol || !ol.id || !ol.name) return;
          var nm = String(ol.name).trim().toLowerCase();
          if(srvIds[ol.id] || srvNames[nm]) return;
          srvIds[ol.id] = 1;
          srvNames[nm] = 1;
          initLists.push(__lMakeList(ol));
        });
      }
    }catch(e){}
    __lState = { version: 2, serverSig: srv.sig, serverSnap: srv.snap, lists: initLists };
    LISTS = __lState.lists;
    __lSave();
    return;
  }

  /* 清洗已保存的列表（去重、去坏项），但不改动成员与顺序 */
  var seenIds = {};
  var cleanLists = [];
  saved.lists.forEach(function(item){
    var l = __lMakeList(item);
    if(!l.id || seenIds[l.id]) return;
    seenIds[l.id] = 1;
    cleanLists.push(l);
  });

  /* 关键：服务器列表未变化时（常规 F5 刷新），100% 原样恢复本地列表，绝不做任何覆盖或合并！ */
  if(saved.serverSig === srv.sig){
    __lState = {
      version: 2,
      serverSig: srv.sig,
      serverSnap: saved.serverSnap || srv.snap,
      lists: cleanLists
    };
    LISTS = __lState.lists;
    return;
  }

  /* 服务器 lists.json 确实发生变更时，仅应用 oldSnap -> srv.snap 的精确增量，保留所有本机移动 */
  var oldSnap = (saved.serverSnap && typeof saved.serverSnap === 'object') ? saved.serverSnap : {};
  var __nm = function(s){ return String(s || '').trim().toLowerCase(); };
  srv.lists.forEach(function(b){
    var mine = cleanLists.filter(function(l){ return l.id === b.id; })[0];
    if(!mine){
      var bn = __nm(b.name);
      mine = cleanLists.filter(function(l){ return __nm(l.name) === bn; })[0] || null;
    }
    if(!mine){
      cleanLists.push(__lMakeList(b));
      return;
    }
    var prevSrv = Array.isArray(oldSnap[b.id]) ? oldSnap[b.id] : [];
    var addedBySrv = b.works.filter(function(rj){ return prevSrv.indexOf(rj) < 0; });
    var removedBySrv = prevSrv.filter(function(rj){ return b.works.indexOf(rj) < 0; });
    var sameMembersAsPrev = mine.works.length === prevSrv.length &&
      mine.works.every(function(rj){ return prevSrv.indexOf(rj) >= 0; });
    if(sameMembersAsPrev && !addedBySrv.length && !removedBySrv.length){
      /* 本地未改过该列表成员时，同步服务器最新排序（如置顶顺序更新） */
      mine.works = b.works.slice();
      return;
    }
    if(removedBySrv.length){
      mine.works = mine.works.filter(function(rj){ return removedBySrv.indexOf(rj) < 0; });
    }
    for(var i = addedBySrv.length - 1; i >= 0; i--){
      var rj = addedBySrv[i];
      if(mine.works.indexOf(rj) < 0) mine.works.unshift(rj);
    }
  });

  __lState = { version: 2, serverSig: srv.sig, serverSnap: srv.snap, lists: cleanLists };
  LISTS = __lState.lists;
  __lSave();
}

function __lById(id){
  for(var i = 0; i < LISTS.length; i++){ if(LISTS[i].id === id) return LISTS[i]; }
  return null;
}
function __lNew(name){
  var id = 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  LISTS.push({ id:id, name:String(name || '').trim(), by:'谢hhhh', works:[] });
  __lSave();
  return id;
}
function __lCover(l){
  for(var i=0;i<l.works.length;i++){ var w = __lFind(l.works[i]); if(w && w.cover) return w.cover; }
  for(var j=0;j<works.length;j++){ if(works[j].cover) return works[j].cover; }
  return '';
}
function __lCount(l){
  var n = 0;
  for(var i = 0; i < l.works.length; i++){ if(__lFind(l.works[i])) n++; }
  return n;
}
function __lListsOf(rj){ return LISTS.filter(function(l){ return l.works.indexOf(rj) >= 0; }); }
function __workListsHtml(rj){
  var ls = __lListsOf(rj);
  if(!ls.length) return '';
  return ls.map(function(l){
    return '<span class="wlist-tag" data-lid="'+esc(l.id)+'">'+esc(l.name)+'</span>';
  }).join('');
}
function __syncWorkListsUi(rj){

/* 原子增删移操作：先校验目标存在再改数据，最后落盘并校验 */
function __lAdd(lid, rj){
  rj = String(rj || '').trim();
  var dst = __lById(lid);
  if(!dst || !rj || !__lValidWork(rj)) return false;
  var idx = dst.works.indexOf(rj);
  if(idx >= 0) dst.works.splice(idx, 1);
  dst.works.unshift(rj);
  return true;
}
function __lRemoveOne(lid, rj){
  rj = String(rj || '').trim();
  var l = __lById(lid);
  if(!l || !rj) return false;
  var idx = l.works.indexOf(rj);
  if(idx >= 0){ l.works.splice(idx, 1); return true; }
  return false;
}
function __lRemoveMany(rjs, lid){
  var list = __lUniq(rjs);
  var count = 0;
  list.forEach(function(rj){ if(__lRemoveOne(lid, rj)) count++; });
  if(count > 0) __lSave();
  return count;
}
function __lToggle(lid, rj){
  rj = String(rj || '').trim();
  var l = __lById(lid);
  if(!l || !rj || !__lValidWork(rj)) return false;
  var added = false;
  if(l.works.indexOf(rj) >= 0){
    __lRemoveOne(lid, rj);
    added = false;
  } else {
    __lAdd(lid, rj);
    added = true;
  }
  __lSave();
  return added;
}
function __lMoveMany(rjs, toLid, fromLid){
  var dst = __lById(toLid);
  if(!dst) return 0;
  var items = __lUniq(rjs).filter(__lValidWork);
  if(!items.length) return 0;
  if(fromLid && fromLid === toLid) return 0;

  var moved = [];
  items.forEach(function(rj){
    var changed = false;
    if(fromLid){
      if(__lRemoveOne(fromLid, rj)) changed = true;
      if(dst.works.indexOf(rj) < 0) changed = true;
    } else {
      LISTS.forEach(function(l){
        if(l.id !== toLid && __lRemoveOne(l.id, rj)) changed = true;
      });
      if(dst.works.indexOf(rj) < 0) changed = true;
    }
    if(changed) moved.push(rj);
  });

  if(!moved.length) return 0;
  /* 保持选中顺序置顶插入目标列表 */
  for(var i = moved.length - 1; i >= 0; i--){
    __lAdd(toLid, moved[i]);
  }
  var saved = __lSave();
  if(!saved){
    showToast('本地存储受限，刷新后可能无法保留更改');
  }
  return moved.length;
}
function __lMove(fromLid, toLid, rj){
  return __lMoveMany([rj], toLid, fromLid) > 0;
}

function __isServerList(lid){

  return false;
}
function __lRename(lid, name){

  if(!l || !nm) return false;
  l.name = nm;
  __lSave();
  return true;
}
function __lDelete(lid){
  if(__isServerList(lid)) return false;
  for(var i = 0; i < LISTS.length; i++){
    if(LISTS[i].id === lid){
      LISTS.splice(i, 1);
      __lSave();

    }

function __exportLists(){
  try{
    var d = new Date();
    var ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    var payload = JSON.stringify({
      version: 2,
      exportedAt: d.toISOString(),
      lists: LISTS.map(function(l){ return { id:l.id, name:l.name, by:l.by || '谢hhhh', works:l.works.slice() }; })
    }, null, 2);
    var blob = new Blob([payload], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'asmr-lists-backup-' + ymd + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try{ a.remove(); URL.revokeObjectURL(url); }catch(e){} }, 1000);
    showToast('已导出列表备份');
  }catch(e){
    showToast('导出失败：' + (e && e.message || '未知错误'));
  }
}
function __importListsRaw(rawText){
  var parsed = JSON.parse(String(rawText || ''));
  var arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.lists) ? parsed.lists : null);
  if(!arr || !arr.length) throw new Error('备份文件中没有有效列表');
  var seen = {}, clean = [];
  arr.forEach(function(item){
    if(!item || (!item.id && !item.name)) return;
    var id = String(item.id || ('L' + Math.random().toString(36).slice(2, 8)));
    if(seen[id]) return;
    seen[id] = 1;
    clean.push(__lMakeList({ id:id, name:item.name, by:item.by, works:item.works }));
  });
  if(!clean.length) throw new Error('没有可导入的列表');
  var srv = __lBuildServerSnap(window.__LISTS__ || []);
  __lState = { version: 2, serverSig: srv.sig, serverSnap: srv.snap, lists: clean };
  LISTS = __lState.lists;
  __lSave();
  return clean.length;
}

var __sheetRjs = [];

function __afterListChange(rjs){
  if(__curView && __curView.type === 'list' && __curView.lid){
    renderListWorks(__curView.lid, true);
  } else if(__curView && __curView.type === 'lists'){
    renderLists(true);
  } else if(__curView && __curView.type === 'work' && __curView.rj){
    if(!rjs || rjs.indexOf(__curView.rj) >= 0) __syncWorkListsUi(__curView.rj);
  }
}

function __hideSheetForm(){
  var f = document.getElementById('asNewForm');
  var n = document.getElementById('asNew');
  var inp = document.getElementById('asNewInput');
  if(f) f.classList.add('hide');
  if(n) n.classList.remove('hide');

}

function __finishMoveUi(targetList, rjs, movedCount){
  closeAddSheet();
  __exitBatch();
  if(__curView && __curView.type === 'work' && rjs.length === 1 && __curView.rj === rjs[0]){
    if(__fromListId && __fromListId !== targetList.id){
      __fromListId = targetList.id;
      renderWork(rjs[0], true);
    } else {
      __syncWorkListsUi(rjs[0]);
    }
  } else {
    __afterListChange(rjs);
  }
  var label = movedCount > 1
    ? ('已移动 ' + movedCount + ' 个音频到「' + targetList.name + '」')
    : ('已移动到「' + targetList.name + '」');
  showToast(label, '去查看', function(){ renderListWorks(targetList.id); });
}

function __renderSheet(){
  var rjs = __sheetRjs.slice();
  var box = document.getElementById('asList');
  var title = document.getElementById('asTitle');
  var sub = document.getElementById('asSub');
  if(!box || !rjs.length) return;
  var singleRj = rjs.length === 1 ? rjs[0] : null;
  var singleWork = singleRj ? __lFind(singleRj) : null;
  if(title){
    title.textContent = (__sheetMode === 'move')
      ? (rjs.length > 1 ? ('移动 ' + rjs.length + ' 个音频到其他列表') : '移动到其他列表')
      : '加入列表';
  }
  if(sub){
    sub.textContent = singleWork
      ? (singleWork.rj + ' · ' + singleWork.title)
      : (rjs.length > 1 ? ('已选择 ' + rjs.length + ' 个音频') : '');
  }
  box.innerHTML = '';
  LISTS.forEach(function(l){
    var on = singleRj ? (l.works.indexOf(singleRj) >= 0) : false;
    var row = document.createElement('div');
    row.className = 'as-row';
    if(__sheetMode === 'move'){
      var isSrc = __sheetFromLid ? (l.id === __sheetFromLid) : (singleRj ? (on && __lListsOf(singleRj).length === 1) : false);
      if(isSrc) row.className += ' disabled';
      row.innerHTML = '<span class="as-tick">'+(isSrc?'●':'→')+'</span>'
        + '<span class="as-n">'+esc(l.name)+'</span>'
        + (isSrc ? '<span class="as-cur">当前列表</span>' : '')
        + '<span class="as-c">'+__lCount(l)+'</span>';
      row.onclick = function(){
        if(isSrc){
          showToast('已在「' + l.name + '」中');
          return;
        }
        var n = __lMoveMany(rjs, l.id, __sheetFromLid);
        if(n > 0){
          __finishMoveUi(l, rjs, n);
        } else {
          showToast('已在「' + l.name + '」中');
        }
      };
    } else {
      row.innerHTML = '<span class="as-tick">'+(on?'✓':'')+'</span>'
        + '<span class="as-n">'+esc(l.name)+'</span>'
        + '<span class="as-c">'+__lCount(l)+'</span>'
        + (!on ? '<button type="button" class="as-mv">移到这里</button>' : '');
      row.onclick = function(ev){
        if(ev.target && ev.target.classList && ev.target.classList.contains('as-mv')){
          ev.stopPropagation();
          var n = __lMoveMany([singleRj], l.id, null);
          if(n > 0) __finishMoveUi(l, [singleRj], n);
          return;
        }
        var added = __lToggle(l.id, singleRj);
        __renderSheet();
        __afterListChange([singleRj]);
        showToast(added ? ('已加入「' + l.name + '」') : ('已从「' + l.name + '」移除'));
      };
    }
    box.appendChild(row);
  });
  __hideSheetForm();
  var sh = document.getElementById('addSheet');
  sh.classList.add('on');
  sh.setAttribute('aria-hidden','false');
}

function openAddSheet(rj){
  rj = String(rj || '').trim();

  __sheetFromLid = null;
  __sheetMode = 'toggle';
  __renderSheet();

function openMoveSheet(rjs, fromLid){

                   rename:__lRename, del:__lDelete, importRaw:__importListsRaw, setTheme:__setTheme,
                   L:function(){ return LISTS; } };
}catch(e){}
(function(){
  if(ttl){ ttl.title = '返回主页'; ttl.onclick = function(){ __clearSearch(); renderLists(); }; }
  var b = document.getElementById('btnLists');
  if(b) b.onclick = function(){ __clearSearch(); renderLists(); };
  var tb = document.getElementById('btnTheme');
  if(tb) tb.onclick = __toggleTheme;
  __syncThemeUi();

  var fi = document.getElementById('importListsFile');
  if(fi) fi.addEventListener('change', function(){
    var file = fi.files && fi.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var cnt = __importListsRaw(reader.result);
        renderLists(true);
        showToast('已成功导入 ' + cnt + ' 个列表');
      }catch(err){
        showToast('导入失败：' + (err && err.message || '格式无效'));
      }
    };
    reader.readAsText(file, 'utf-8');
  });

  var x = document.getElementById('asClose');
  if(x) x.onclick = closeAddSheet;
  var nw = document.getElementById('asNew');
  if(nw) nw.onclick = __lAsk;
  var sh = document.getElementById('addSheet');
  if(sh) sh.addEventListener('click', function(e){ if(e.target === sh) closeAddSheet(); });

  var bbMove = document.getElementById('bbMove');
  var bbDel = document.getElementById('bbDel');
  var bbCancel = document.getElementById('bbCancel');
  if(bbMove) bbMove.onclick = function(){
    if(!__batchSel.length){ showToast('请先选择要移动的音频'); return; }
    openMoveSheet(__batchSel.slice(), __curView && __curView.lid);
  };
  if(bbDel) bbDel.onclick = function(){
    if(!__batchSel.length){ showToast('请先选择要移出的音频'); return; }
    var lid = __curView && __curView.lid;
    var l = __lById(lid);
    var n = __lRemoveMany(__batchSel.slice(), lid);
    __exitBatch();
    if(lid) renderListWorks(lid, true);
    if(n > 0 && l) showToast('已从「' + l.name + '」移出 ' + n + ' 个音频');
  };
  if(bbCancel) bbCancel.onclick = function(){
    var lid = __curView && __curView.lid;
    __exitBatch();
    if(lid) renderListWorks(lid, true);
  };

  var af = document.getElementById('asNewForm');
  var ac = document.getElementById('asNewCancel');
  if(ac) ac.onclick = __hideSheetForm;
  if(af) af.addEventListener('submit', function(e){
    e.preventDefault();
    var inp = document.getElementById('asNewInput');
    var name = String(inp ? inp.value : '').trim();
    if(!name) return;
    var id = __lNew(name);
    var dst = __lById(id);
    var rjs = __sheetRjs.slice(), fromLid = __sheetFromLid, mode = __sheetMode;
    if(rjs.length){
      if(mode === 'move'){
        var n = __lMoveMany(rjs, id, fromLid);
        if(dst) __finishMoveUi(dst, rjs, n || rjs.length);
      } else {
        __lAdd(id, rjs[0]);
        __lSave();
        __renderSheet();
        __afterListChange(rjs);
        showToast('已创建并加入「' + name + '」');
      }
    } else {
      closeAddSheet();
      renderLists(true);
      showToast('已创建列表「' + name + '」');
    }
  });

  var nlm = document.getElementById('newListModal');
  var nlf = document.getElementById('nlForm');
  var nlc = document.getElementById('nlCancel');
  if(nlc) nlc.onclick = closeNewListModal;
  if(nlm) nlm.addEventListener('click', function(e){ if(e.target === nlm) closeNewListModal(); });
  if(nlf) nlf.addEventListener('submit', function(e){
    e.preventDefault();
    var inp = document.getElementById('nlInput');
    var name = String(inp ? inp.value : '').trim();
    if(!name) return;
    if(__editingLid){
      var eid = __editingLid;
      __lRename(eid, name);
      closeNewListModal();
      if(__curView && __curView.type === 'list' && __curView.lid === eid) renderListWorks(eid, true);
      else renderLists(true);
      showToast('已重命名为「' + name + '」');
      return;
    }
    __lNew(name);
    closeNewListModal();
    renderLists(true);
    showToast('已创建列表「' + name + '」');
  });

  var dlm = document.getElementById('delListModal');
  var dlc = document.getElementById('dlCancel');
  var dlk = document.getElementById('dlConfirm');
  if(dlc) dlc.onclick = closeDelListModal;
  if(dlm) dlm.addEventListener('click', function(e){ if(e.target === dlm) closeDelListModal(); });
  if(dlk) dlk.onclick = function(){
    var lid = __deletingLid;
    var l = __lById(lid);
    var lname = l ? l.name : '';
    closeDelListModal();
    if(lid && __lDelete(lid)){
      renderLists(true);
      showToast('已删除列表「' + lname + '」');
    }
  };
})();

document.addEventListener('keydown', function(e){
  var tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
  var typing = tag === 'INPUT' || tag === 'TEXTAREA';
  if(e.code==='Space' && !typing && full.classList.contains('on')){ e.preventDefault();
    if(au.paused){var p=au.play();if(p&&p.catch)p.catch(function(){})}else au.pause(); }
  if(e.code==='Escape'){
    var dlm = document.getElementById('delListModal');
    if(dlm && dlm.classList.contains('on')){ closeDelListModal(); return; }
    var nlm = document.getElementById('newListModal');
    if(nlm && nlm.classList.contains('on')){ closeNewListModal(); return; }
    var sh = document.getElementById('addSheet');
    if(sh && sh.classList.contains('on')){ closeAddSheet(); return; }
    full.classList.remove('on');
  }
});

window.addEventListener('error', function(e){
  try { var d=document.createElement('div'); d.style.cssText='position:fixed;left:4px;bottom:70px;z-index:9999;background:#c00;color:#fff;font-size:10px;padding:3px 6px;border-radius:4px;max-width:90vw'; d.textContent='JS: '+e.message; document.body.appendChild(d); setTimeout(function(){d.remove()},8000); } catch(x){}
});

/* 启动 */
if (window.__hist) __hist.init();
window.__pipHttpsPort = 8443;
window.__pipHttpsReady = false;
try{
  if (!/\.github\.io$/i.test(location.hostname || '')){
    fetch('/__pip_config', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(c){
      if (c && c.httpsPort) window.__pipHttpsPort = c.httpsPort;
      window.__pipHttpsReady = !!(c && c.httpsReady);
      if (window.__pipHttpsReady && location.protocol === 'http:' && isDesktopChromium() &&
          location.hostname !== 'localhost' && location.hostname !== '127.0.0.1' &&
          !/[?&]nossl=1/.test(location.search)){
        var port = c.httpsPort || 8443;
        location.replace('https://' + location.hostname + ':' + port + location.pathname + location.search + location.hash);
      }
    }).catch(function(){ window.__pipHttpsReady = false; });
  }
}catch(e){ window.__pipHttpsReady = false; }
__clearSearch();
renderLists(true);
window.__bootOK = true;

/* ---------- 从 HTTP 切到 HTTPS 后恢复播放，并提示点开系统画中画 ---------- */
(function(){
  try{
    var q = new URLSearchParams(location.search || '');
    if (q.get('pip') !== '1') return;
    var rj = q.get('rj');
    if (!rj) return;
    var i = parseInt(q.get('i') || '0', 10) || 0;
    var t = parseFloat(q.get('t') || '0') || 0;
    var shouldPlay = q.get('p') !== '0';
    var w = works.find(function(x){ return x.rj === rj; });
    if (!w) return;
    renderWork(rj, true);
    playTrack(rj, Math.max(0, Math.min(i, w.tracks.length - 1)));
    openFull();
    function seek(){ try{ au.currentTime = t; }catch(e){} }
    if (au.readyState >= 1) seek(); else au.addEventListener('loadedmetadata', seek, {once:true});
    if (!shouldPlay){ try{ au.pause(); }catch(e){} }
    try{ history.replaceState(history.state, '', location.pathname); }catch(e){}
    setTimeout(function(){ showPipGate('open'); }, 400);
  }catch(e){}
})();


/* 预热 PiP：等 DOM 就绪后初始化 canvas/stream，避免首次点按时 metadata 未就绪 */
setTimeout(function(){
  try { PiP.init(); log('prewarmed, canvas=' + PiP.canvas.width + 'x' + PiP.canvas.height); }
  catch(e){ log('prewarm failed: ' + e.message); }
  try { FloatSub.init(); log('floatsub ready'); } catch(e){ log('floatsub failed: ' + e.message); }
}, 1200);

/* 浮窗字幕持续更新 */
setInterval(function(){
  if (!FloatSub.on) return;
  var t = textOfNow();
  if (FloatSub.textEl && FloatSub.textEl.textContent !== t) FloatSub.set(t);
}, 300);
})();
</script>
</body>
